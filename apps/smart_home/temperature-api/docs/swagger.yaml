            additionalProperties:
              type: string
            type: object
        "405":
          description: Метод не разрешен
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Работа с сенсорами
      tags:
      - Сенсоры
  /api/v1/sensors/{id}:
    delete:
      consumes:
      - application/json
      description: Получение, обновление или удаление сенсора по ID
      parameters:
      - description: ID сенсора
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Информация о сенсоре
          schema:
            $ref: '#/definitions/main.Sensor'
        "204":
          description: Сенсор удален
        "400":
          description: Неверный запрос
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Сенсор не найден
          schema:
            additionalProperties:
              type: string
            type: object
        "405":
          description: Метод не разрешен
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Работа с конкретным сенсором
      tags:

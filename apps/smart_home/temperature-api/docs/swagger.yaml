        "204":
          description: Сенсор удален
        "400":
          description: Неверный запрос
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Сенсор не найден
          schema:
            additionalProperties:
              type: string
            type: object
        "405":
          description: Метод не разрешен
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Работа с конкретным сенсором
      tags:
      - Сенсоры
  /temperature:
    get:
      consumes:
      - application/json
      description: Возвращает текущую температуру для указанного местоположения или
        датчика
      parameters:
      - description: Название местоположения
        in: query
        name: location
        type: string
      - description: Идентификатор датчика
        in: query
        name: sensorId
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.TemperatureResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Получить текущую температуру
      tags:
      - Телеметрия
swagger: "2.0"
